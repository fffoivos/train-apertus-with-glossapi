# Q3: IPO, run for the FIRST time. The pair labelled "IPO beta 10" trained anchored sigmoid DPO
# because cluster/dpo_train.py hardcoded loss_type="sigmoid" and ignored this key. The trainer now
# reads it and refuses an unsupported value, so this config finally does what it says.
# Comparison partner: G4F6P1_DPO01_IPO42 (same beta, same seed, sigmoid) -> like-for-like on objective.
# IPO arm at the CORRECTED beta. TRL 1.12 computes ipo_delta as a difference of two
# INDEPENDENTLY length-normalised log-ratios, so the target is 1/(2*beta) PER TOKEN.
# Measured on our runs: DPO reaches 0.135 on train and 0.008 on dev. beta 10 -> target 0.050:
# above what generalises, a third of what did not. The original beta 0.1 would have targeted
# 5.0, ~37x the memorised value. Verified by cluster/test_dpo_local.py (2 ipo fixtures).
# R-DPO5 HIGH stands: beta also scales the initial gradient (dL/ddelta at 0 = -1/beta), so
# movement MUST be read alongside the benchmarks - a preserved benchmark may mean little learning.
# DPO01: one full-parameter, one-epoch sigmoid DPO run against the frozen SFT parent G4F6P1.
# Plan: docs/RLHF_COORDINATION/DPO01_EXECUTION_PLAN_20260918.md §5. Data: data/rlhf/dpo01/ (round 1 and the maths task excluded).
run_name: G4F6P1--DPO01--TRUEIPO42
arm: DPO01
model_name_or_path: /iopsstor/scratch/cscs/fffoivos/sft_round1/eval_copies/R4_full_ep1
tokenizer_name_or_path: /iopsstor/scratch/cscs/fffoivos/sft_round1/eval_copies/R4_full_ep1
template_source: swiss-ai/Apertus-8B-Instruct-2509
train_file: data/rlhf/dpo01/train.jsonl
dev_file: data/rlhf/dpo01/dev.jsonl
output_dir: runs/G4F6P1--DPO01--TRUEIPO42
# objective
beta: 10.0
loss_type: ipo
label_smoothing: 0.0
learning_rate: 2.0e-6
num_train_epochs: 3
lr_scheduler_type: constant_with_warmup
warmup_steps: 2
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1.0e-8
max_grad_norm: 1.0
seed: 42
# layout: 4 GPUs x 1 pair x accumulation 2 = 8 pairs per optimizer update
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
planned_world_size: 4
max_length: 4096
fp32_master_weights: true
precompute_ref_log_probs: false   # TRL 1.12 precompute writes per-rank arrow caches and reloads them across ranks; plan §6 fallback: a live frozen reference
attn_implementation: sdpa
require_apertus_control_ids: true
save_strategy: epoch
save_total_limit: 3
chosen_nll_alpha: 0.25
