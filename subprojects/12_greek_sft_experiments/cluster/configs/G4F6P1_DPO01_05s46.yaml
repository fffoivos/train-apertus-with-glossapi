# SEED REPLICATE 46 of arm 05. With 42/43/44/45/46 this arm reaches n=5, which is what
# the alpha question actually needs: run-to-run variation is large (5.4pp cross-seed on dev
# accuracy; same-seed runs diverge at optimiser step 3 under ZeRO-3 + bf16).
# DPO01: one full-parameter, one-epoch sigmoid DPO run against the frozen SFT parent G4F6P1.
# Plan: docs/RLHF_COORDINATION/DPO01_EXECUTION_PLAN_20260918.md §5. Data: data/rlhf/dpo01/ (round 1 and the maths task excluded).
run_name: G4F6P1--DPO01--05s46
arm: DPO01
model_name_or_path: /iopsstor/scratch/cscs/fffoivos/sft_round1/eval_copies/R4_full_ep1
tokenizer_name_or_path: /iopsstor/scratch/cscs/fffoivos/sft_round1/eval_copies/R4_full_ep1
template_source: swiss-ai/Apertus-8B-Instruct-2509
train_file: data/rlhf/dpo01/train.jsonl
dev_file: data/rlhf/dpo01/dev.jsonl
output_dir: runs/G4F6P1--DPO01--05s46
# objective
beta: 0.1
label_smoothing: 0.0
learning_rate: 2.0e-6
num_train_epochs: 3
lr_scheduler_type: constant_with_warmup
