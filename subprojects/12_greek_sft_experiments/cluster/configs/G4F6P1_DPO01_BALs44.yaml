# DPO01: one full-parameter, one-epoch sigmoid DPO run against the frozen SFT parent G4F6P1.
# CONTROL ARM for the length hypothesis. Identical to arm 01 (lr 2e-6, alpha 0, 3 epochs, seed 42)
# except the pair set: data/rlhf/dpo01_balanced/, which is DPO01 with the length signal removed by
# greedy magnitude matching (274 of 343 train pairs; chosen shorter in 50% vs 59%; mean chosen/rejected
# word ratio 0.992 vs 0.785). If terseness is what damages MGSM and the response envelope, this arm
# should hold them where arm 01 loses them. Same recipe, fewer pairs - so compare shapes, not levels.
run_name: G4F6P1--DPO01--BALs44
arm: DPO01
model_name_or_path: /iopsstor/scratch/cscs/fffoivos/sft_round1/eval_copies/R4_full_ep1
tokenizer_name_or_path: /iopsstor/scratch/cscs/fffoivos/sft_round1/eval_copies/R4_full_ep1
template_source: swiss-ai/Apertus-8B-Instruct-2509
train_file: data/rlhf/dpo01_balanced/train.jsonl
dev_file: data/rlhf/dpo01_balanced/dev.jsonl
output_dir: runs/G4F6P1--DPO01--BALs44
# objective
beta: 0.1
label_smoothing: 0.0
learning_rate: 2.0e-6
num_train_epochs: 3
lr_scheduler_type: constant_with_warmup
warmup_steps: 2
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1.0e-8
max_grad_norm: 1.0
seed: 44
# layout: 4 GPUs x 1 pair x accumulation 2 = 8 pairs per optimizer update
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
planned_world_size: 4
max_length: 4096
fp32_master_weights: true
precompute_ref_log_probs: false   # TRL 1.12 precompute writes per-rank arrow caches and reloads them across ranks; plan §6 fallback: a live frozen reference
attn_implementation: sdpa
require_apertus_control_ids: true
save_strategy: epoch
save_total_limit: 3
chosen_nll_alpha: 0
