# Krikri base-card protocol: ARC-Challenge Greek (ilsp/arc_greek), 25-shot from train, full-text choices (lm_eval arc template, Greek cue words)
tag:
  - krikri_suite_el
task: arc_challenge_el
dataset_path: ilsp/arc_greek
dataset_name: ARC-Challenge
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
num_fewshot: 25
doc_to_text: "Ερώτηση: {{question}}\nΑπάντηση:"
doc_to_target: "{{choices.label.index(answerKey)}}"
doc_to_choice: "{{choices.text}}"
should_decontaminate: true
doc_to_decontamination_query: "Ερώτηση: {{question}}\nΑπάντηση:"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
